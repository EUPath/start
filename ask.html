<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작점</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
body { margin: 0; background: #FFFFFF; color: #000000; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.wrap { max-width: 560px; margin: 15vh auto; padding: 0 16px; font-size: 18px; line-height: 1.8; }
.brand { margin: 0 0 16px; font-size: 16px; font-weight: 700; }
#msg { margin: 0; }
.grey { color: #7F7F7F; }
button { font: inherit; font-size: 16px; font-weight: 700; border-radius: 999px; padding: 8px 20px; margin-top: 16px; cursor: pointer; border: 1px solid #000; background: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">시작점</p>
  <p id="msg" class="grey">신청하는 중입니다…</p>
</div>
<script src="endpoint.js"></script>
<script>
// 결과 메일의 신청 버튼이 여기로 온다. Google 주소를 바로 열면 Google 계정이 여러 개 로그인된 브라우저에서 오류가 나서,
// 이 페이지가 뒤에서 웹 앱(doGet)에 보내고 답 문장만 보여 준다
const q = new URLSearchParams(location.search), msg = document.getElementById("msg");
async function go() {
  msg.className = "grey"; msg.textContent = "신청하는 중입니다…";
  for (const wait of [0, 2000, 5000]) {
    await new Promise(r => setTimeout(r, wait));
    try {
      const res = await fetch(`${ENDPOINT}?fmt=json&ask=${encodeURIComponent(q.get("ask") || "")}&id=${encodeURIComponent(q.get("id") || "")}`);
      const out = await res.json();
      msg.className = ""; msg.textContent = out.text;
      return;
    } catch (_) {}
  }
  msg.className = "";
  msg.innerHTML = '연결이 되지 않았어요. <br><button type="button" id="retry">다시 시도</button>';
  document.getElementById("retry").onclick = go;
}
go();
</script>
</body>
</html>
